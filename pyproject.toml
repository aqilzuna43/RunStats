[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runstats"
version = "0.1.0"
description = "Render route-based run-stat overlays from FIT and GPX activity files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fitparse>=1.2",
    "gpxpy>=1.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
runstats = "runstats.cli:main"

[tool.setuptools]
packages = ["runstats"]
