<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-primary": "#516700",
              "surface": "#0e0e0e",
              "tertiary-fixed": "#ffffff",
              "secondary-container": "#b02f00",
              "on-tertiary": "#5e5f60",
              "on-secondary-fixed": "#661700",
              "surface-dim": "#0e0e0e",
              "surface-bright": "#2c2c2c",
              "on-background": "#ffffff",
              "tertiary-dim": "#ebebeb",
              "primary": "#f3ffca",
              "on-tertiary-fixed": "#4f5051",
              "tertiary-fixed-dim": "#f0f1f1",
              "surface-container-highest": "#262626",
              "on-surface": "#ffffff",
              "on-primary": "#516700",
              "primary-fixed-dim": "#beee00",
              "outline-variant": "#484847",
              "on-tertiary-fixed-variant": "#6c6d6e",
              "background": "#0e0e0e",
              "tertiary-container": "#ebebeb",
              "tertiary": "#f9f9f9",
              "surface-container-lowest": "#000000",
              "secondary-dim": "#ff734a",
              "primary-dim": "#beee00",
              "on-secondary-fixed-variant": "#982700",
              "secondary": "#ff734a",
              "surface-container-high": "#20201f",
              "on-tertiary-container": "#555757",
              "primary-fixed": "#cafd00",
              "error": "#ff7351",
              "surface-variant": "#262626",
              "error-container": "#b92902",
              "on-secondary-container": "#fff6f4",
              "outline": "#767575",
              "error-dim": "#d53d18",
              "secondary-fixed-dim": "#ffb19b",
              "on-error": "#450900",
              "inverse-surface": "#fcf9f8",
              "on-primary-container": "#4a5e00",
              "surface-tint": "#f3ffca",
              "primary-container": "#cafd00",
              "on-surface-variant": "#adaaaa",
              "on-primary-fixed-variant": "#526900",
              "surface-container-low": "#131313",
              "surface-container": "#1a1a1a",
              "secondary-fixed": "#ffc4b4",
              "inverse-on-surface": "#565555",
              "on-secondary": "#430c00",
              "on-primary-fixed": "#3a4a00",
              "on-error-container": "#ffd2c8"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-path-glow {
            filter: drop-shadow(0 0 8px rgba(255, 115, 74, 0.6));
        }
        .text-glow-primary {
            text-shadow: 0 0 20px rgba(243, 255, 202, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary antialiased">
<!-- Background Image Overlay (The Story Canvas) -->
<div class="fixed inset-0 z-0">
<img alt="cinematic wide shot of a modern bridge in Amsterdam at dusk with warm city lights reflecting on the water" class="w-full h-full object-cover brightness-[0.4]" data-alt="cinematic wide shot of a modern bridge in Amsterdam at dusk with warm city lights reflecting on the water" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHO46hzp0b8mu-lRxSqcsKY_FHECq6_qpEjBtb0MPkDAn7gO4jTlEHuvYqifH5D19uZly1A4q-zZ-4N37X73NyrKupzgyciDv-kutqDRSbbkVCgrUZQ3uW_-haRWGb1E-CATkqqBrhAgaSIVbgu8Y7rr5uXsgWfFdPdKzFpnTmScZ61ON1TlGUFm4wcjWdYXhbcTl51yYHeKhO_LETziwVgIav7herl7so59MyEK4kHnsWQlqj6g52ZDVRry4hEexC4kWYPOweooqZ"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-transparent to-surface/80"></div>
</div>
<!-- TopAppBar (Amsterdam, NL) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-transparent">
<button class="text-white/60 hover:opacity-80 transition-opacity scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="text-sm font-bold tracking-[0.1em] uppercase text-white font-['Space_Grotesk']">
            AMSTERDAM, NL
        </h1>
<button class="text-white/60 hover:opacity-80 transition-opacity scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="share">share</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 min-h-screen flex flex-col justify-center items-center px-6 pt-20 pb-40">
<!-- Vertical Center: GPS Route Line -->
<div class="flex-grow flex items-center justify-center w-full max-w-xs">
<svg class="w-full h-[353px] kinetic-path-glow opacity-90" preserveaspectratio="xMidYMid meet" viewbox="0 0 200 300">
<path d="M40,280 Q60,240 80,250 T120,180 T160,150 T100,80 T40,40" fill="none" stroke="#ff734a" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
<circle cx="40" cy="280" fill="#ff734a" r="4"></circle>
<circle class="animate-pulse" cx="40" cy="40" fill="#f3ffca" r="5"></circle>
</svg>
</div>
<!-- Metric Section Container -->
<div class="w-full max-w-md">
<!-- Hero Metric: Distance -->
<div class="text-center mb-8">
<span class="block font-label text-[0.6875rem] font-bold tracking-[0.2em] text-white/50 mb-1">DISTANCE</span>
<h2 class="font-headline text-[4rem] md:text-[5rem] font-bold leading-none tracking-tighter text-white text-glow-primary">
                    10.50<span class="text-primary text-[1.5rem] ml-2 font-medium tracking-normal">KM</span>
</h2>
</div>
<!-- Frosted Glass Card for Secondary Metrics -->
<div class="bg-surface-variant/40 backdrop-blur-2xl rounded-xl p-8 shadow-[0px_20px_40px_rgba(0,0,0,0.15)] outline outline-1 outline-white/10">
<div class="grid grid-cols-2 gap-8 divide-x divide-white/10">
<!-- Pace Column -->
<div class="flex flex-col items-center justify-center">
<span class="font-label text-[0.625rem] font-bold tracking-[0.15em] text-secondary mb-2">AVG PACE</span>
<div class="flex items-baseline gap-1">
<span class="font-headline text-2xl font-semibold text-white">05:30</span>
<span class="font-body text-[0.75rem] text-white/40">/KM</span>
</div>
</div>
<!-- Time Column -->
<div class="flex flex-col items-center justify-center">
<span class="font-label text-[0.625rem] font-bold tracking-[0.15em] text-white/50 mb-2">TIME</span>
<div class="flex items-baseline gap-1">
<span class="font-headline text-2xl font-semibold text-white">00:57:45</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#0e0e0e]/40 backdrop-blur-xl rounded-t-2xl">
<!-- Stats Active -->
<a class="flex flex-col items-center justify-center text-[#f3ffca] bg-[#f3ffca]/10 rounded-xl px-4 py-2 transition-transform duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="monitoring">monitoring</span>
<span class="font-['Manrope'] text-[0.6875rem] font-bold tracking-[0.1em] uppercase">STATS</span>
</a>
<!-- Route Inactive -->
<a class="flex flex-col items-center justify-center text-white/50 px-4 py-2 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="polyline">polyline</span>
<span class="font-['Manrope'] text-[0.6875rem] font-bold tracking-[0.1em] uppercase">ROUTE</span>
</a>
<!-- Share Inactive -->
<a class="flex flex-col items-center justify-center text-white/50 px-4 py-2 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="ios_share">ios_share</span>
<span class="font-['Manrope'] text-[0.6875rem] font-bold tracking-[0.1em] uppercase">SHARE</span>
</a>
</nav>
</body></html>
